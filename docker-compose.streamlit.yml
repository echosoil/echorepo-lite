services:
  streamlit:
    build:
      context: ./streamlit

    restart: unless-stopped

    ports:
      - "172.31.5.252:8501:8501"
      
    environment:
      ECHOREPO_URL: "http://echorepo-lite:8000"
      PYTHONPATH: "/app"

    volumes:
      - ./notebooks/lib:/app/lib:ro

    command:
      - streamlit
      - run
      - streamlit_app.py
      - --server.address=0.0.0.0
      - --server.port=8501
      - --server.headless=true
      - --server.baseUrlPath=research/dashboard

    networks:
      - default