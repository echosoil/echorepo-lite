# The only application API surface available on the isolated user network.
server {
    listen 8080;
    server_name _;

    # Only read-only canonical datasets and connectivity.
    location = /api/v1/ping {
        limit_except GET { deny all; }
        proxy_pass http://echorepo-lite:8000;
        proxy_read_timeout 300s;
    }
    location ^~ /api/v1/canonical/ {
        limit_except GET { deny all; }
        proxy_pass http://echorepo-lite:8000;
        proxy_read_timeout 300s;
        proxy_buffering off;
    }
    location / {
        return 404;
    }
}
