name: Guild publication audit (offline)
on:
  pull_request:
    branches: ["develop"]
    paths:
      - "tools/guild_publication_audit.py"
      - "tests/test_guild_publication_audit.py"
      - ".github/workflows/guild-publication-audit.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install pytest
      - run: python -m pytest -q tests/test_guild_publication_audit.py
