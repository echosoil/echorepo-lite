name: Large biodiversity importer checks

on:
  pull_request:
    paths:
      - "echorepo/services/biodiversity_import.py"
      - "tools/import_biodiversity_large.py"
      - "tools/prepare_split_biodiversity_for_echorepo_premin10.py"
      - "tools/generate_biodiversity_piecharts.py"
      - "tests/test_biodiversity_large_import.py"
      - "tests/test_biodiversity_split_parts.py"
      - "tests/test_biodiversity_split_optimizations.py"
      - "tools/benchmark_biodiversity_split.py"
      - ".github/workflows/biodiversity-large-import.yml"
  workflow_dispatch:

env:
  PROJECT_ROOT: .
  CSV_PATH: data/samples.csv
  SQLITE_PATH: data/legacy.sqlite

jobs:
  streaming-import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Compile changed Python modules
        run: |
          python -m py_compile echorepo/services/biodiversity_import.py
          python -m py_compile tools/import_biodiversity_large.py
          python -m py_compile tools/generate_biodiversity_piecharts.py
          python -m py_compile tests/test_biodiversity_large_import.py
          python -m py_compile tools/prepare_split_biodiversity_for_echorepo_premin10.py
          python -m py_compile tools/benchmark_biodiversity_split.py
          python -m py_compile tests/test_biodiversity_split_optimizations.py
          python -m py_compile tests/test_biodiversity_split_parts.py
      - name: Unit tests without PostgreSQL
        run: |
          python -m unittest discover -s tests -p "test_biodiversity_*import.py" -v
          python -m unittest discover -s tests -p "test_biodiversity_split_parts.py" -v
          python -m unittest discover -s tests -p "test_biodiversity_split_optimizations.py" -v
