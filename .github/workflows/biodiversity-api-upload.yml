name: Biodiversity API upload and column-split checks

on:
  pull_request:
    branches: ["develop"]
    paths:
      - "echorepo/services/biodiversity_api_jobs.py"
      - "echorepo/services/biodiversity_import.py"
      - "echorepo/routes/data_api.py"
      - "tools/prepare_split_biodiversity_for_echorepo_premin10.py"
      - "tools/consume_biodiversity_jobs.py"
      - "tools/generate_biodiversity_piecharts.py"
      - "tools/faprotax_streaming.py"
      - "tests/test_faprotax_streaming.py"
      - "tests/test_biodiversity_guild_plot_labels.py"
      - "tests/test_biodiversity_api_upload.py"
      - "tests/test_biodiversity_split_parts.py"
      - "tests/test_biodiversity_split_progress.py"
      - "tests/test_biodiversity_split_optimizations.py"
      - "tools/benchmark_biodiversity_split.py"
      - "tests/test_biodiversity_queue_integration.py"
      - ".github/workflows/biodiversity-api-upload.yml"
  workflow_dispatch:

env:
  PROJECT_ROOT: .
  CSV_PATH: data/samples.csv
  SQLITE_PATH: data/legacy.sqlite
  DB_HOST_INSIDE: 127.0.0.1
  DB_PORT_INSIDE: "5432"
  DB_NAME: echorepo
  DB_USER: echorepo
  DB_PASSWORD: echorepo-pass

jobs:
  tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: echorepo
          POSTGRES_PASSWORD: echorepo-pass
          POSTGRES_DB: echorepo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U echorepo -d echorepo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
      - name: Compile changed modules
        run: |
          python -m py_compile echorepo/services/biodiversity_import.py
          python -m py_compile echorepo/services/biodiversity_api_jobs.py
          python -m py_compile echorepo/routes/data_api.py
          python -m py_compile tools/consume_biodiversity_jobs.py
          python -m py_compile tools/prepare_split_biodiversity_for_echorepo_premin10.py
          python -m py_compile tools/benchmark_biodiversity_split.py
          python -m py_compile tools/generate_biodiversity_piecharts.py
          python -m py_compile tools/faprotax_streaming.py
          python -m py_compile tests/test_biodiversity_api_upload.py
          python -m py_compile tests/test_biodiversity_guild_plot_labels.py
          python -m py_compile tests/test_biodiversity_split_parts.py
          python -m py_compile tests/test_biodiversity_split_progress.py
          python -m py_compile tests/test_biodiversity_split_optimizations.py
          python -m py_compile tests/test_biodiversity_queue_integration.py
      - name: Test upload and splitting
        run: |
          python -m unittest discover -s tests -p "test_biodiversity_api_upload.py" -v
          python -m unittest discover -s tests -p "test_biodiversity_guild_plot_labels.py" -v
          python -m unittest discover -s tests -p "test_biodiversity_split_parts.py" -v
          python -m unittest discover -s tests -p "test_biodiversity_split_progress.py" -v
          python -m unittest discover -s tests -p "test_biodiversity_split_optimizations.py" -v
      - name: Integration test against temporary PostgreSQL
        env:
          BIODIV_DB_TEST: "1"
        run: |
          python -m unittest discover -s tests -p "test_biodiversity_queue_integration.py" -v
