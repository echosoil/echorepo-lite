name: RO4-1 inventory (offline)
on:
  pull_request:
    branches: ["develop"]
    paths:
      - "tools/ro41_inventory.py"
      - "tools/r73_interoperability.py"
      - "tests/test_ro41_inventory.py"
      - ".github/workflows/ro4-1-inventory.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install pytest requests
      - run: python -m pytest -q tests/test_ro41_inventory.py
