name: FUNGuild numerical export (offline)
on:
  pull_request:
    branches: ["develop"]
    paths:
      - "tools/export_funguild_profiles.py"
      - "tools/generate_biodiversity_piecharts.py"
      - "tests/test_funguild_numerical_export.py"
      - "tests/test_biodiversity_guild_plot_labels.py"
      - ".github/workflows/funguild-numerical-export.yml"
  workflow_dispatch:
jobs:
  offline:
    runs-on: ubuntu-latest
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install pandas matplotlib python-dotenv openpyxl minio psycopg2-binary
      - run: |
          python -m unittest discover -s tests -p 'test_funguild_numerical_export.py' -v
          python -m unittest discover -s tests -p 'test_biodiversity_guild_plot_labels.py' -v
