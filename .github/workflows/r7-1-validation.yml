name: R7-1 component validation

on:
  pull_request:
    branches: ["develop"]
    paths:
      - "echorepo/**"
      - "scripts/translate_data.sh"
      - "tools/translate_free_text_en.py"
      - "tools/retranslation_journal.py"
      - "tests/test_free_text_translation.py"
      - "tests/test_manual_en_admin.py"
      - "tests/test_manual_en_postgres.py"
      - "migrations/postgres/20261126_002_manual_en_overrides.sql"
      - "tests/test_translation_display.py"
      - "tests/test_photo_descriptions.py"
      - "tools/pull_and_enrich_samples.py"
      - "tools/pull_and_enrich_samples_noblur.py"
      - "static/js/map.js"
      - "static/css/site.css"
      - "requirements.txt"
      - "Dockerfile"
      - "tests/test_r73_hardening.py"
      - "tests/test_r73_maintenance.py"
      - "scripts/make_release.sh"
      - "streamlit/**"
      - "notebooks/lib/**"
      - "scripts/run_pg_migrations.py"
      - "metadata/canonical/**"
      - "tools/validate_echorepo_bundle.py"
      - "tools/publish_api_file_to_zenodo.py"
      - "tools/r71_validation_report.py"
      - "tools/r71_phase2_guard.py"
      - "tools/r71_phase2_report.py"
      - "tools/r71_phase3_guard.py"
      - "tools/r71_phase3_report.py"
      - "tools/r71_phase4_report.py"
      - "docs/R7_1_PHASE4.md"
      - "docs/R7_1_PHASE4_EXTERNAL.json"
      - "docs/R7_1_PHASE4_LINKS.json"
      - "tests/e2e/test_r71_phase3_browser.py"
      - "docs/R7_1_PHASE3_MATRIX.json"
      - "docs/R7_1_PHASE3.md"
      - "docs/R7_1_PHASE2_MATRIX.json"
      - "docs/R7_1_PHASE2.md"
      - "tests/integration/test_r71_phase2_live.py"
      - "tests/test_r71_*.py"
      - "tests/test_biodiversity_api_upload.py"
      - "tests/test_server_sessions.py"
      - "tests/test_jupyterhub_auth.py"
      - "tests/test_loess_i18n.py"
      - "tests/test_loess_converter.py"
      - "tests/test_loess_photo_urls.py"
      - "docs/R7_1_VALIDATION_MATRIX.json"
      - ".github/workflows/r7-1-validation.yml"
  workflow_dispatch:

env:
  PROJECT_ROOT: .
  CSV_PATH: data/samples.csv
  SQLITE_PATH: data/legacy.sqlite

permissions:
  contents: read

jobs:
  r71:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install application and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest PyJWT

      - name: Syntax-check validation modules
        run: |
          python -m py_compile \
            tests/test_r71_api_web.py \
            tests/test_r71_data_contracts.py \
            tests/test_r71_storage_lab.py \
            tests/test_r71_research.py \
            tests/test_r71_phase2_guard.py \
            tests/test_r71_phase3_guard.py \
            tests/test_r71_phase4_report.py \
            tests/integration/test_r71_phase2_live.py \
            tests/e2e/test_r71_phase3_browser.py \
            tools/r71_validation_report.py \
            tools/r71_phase2_guard.py \
            tools/r71_phase2_report.py \
            tools/r71_phase3_guard.py \
            tools/r71_phase3_report.py \
            tools/r71_phase4_report.py

      - name: Check free-text translation pipeline and display
        run: |
          bash -n scripts/translate_data.sh
          node --check static/js/map.js
          python -m pytest -q tests/test_free_text_translation.py tests/test_manual_en_admin.py tests/test_translation_display.py tests/test_photo_descriptions.py tests/test_loess_my_attribution.py

      - name: Execute isolated acceptance and regression tests
        id: tests
        continue-on-error: true
        run: |
          mkdir -p r71-evidence
          python -m pytest -q \
            tests/test_r71_api_web.py \
            tests/test_r71_data_contracts.py \
            tests/test_r71_storage_lab.py \
            tests/test_r71_research.py \
            tests/test_r71_phase2_guard.py \
            tests/test_r71_phase3_guard.py \
            tests/integration/test_r71_phase2_live.py \
            tests/e2e/test_r71_phase3_browser.py \
            tests/test_biodiversity_api_upload.py \
            tests/test_server_sessions.py \
            tests/test_r73_hardening.py \
            tests/test_r73_maintenance.py \
            tests/test_jupyterhub_auth.py \
            tests/test_loess_converter.py \
            tests/test_loess_photo_urls.py \
            tests/test_loess_i18n.py \
            --junitxml=r71-evidence/results.xml \
            2>&1 | tee r71-evidence/pytest.log
          exit "${PIPESTATUS[0]}"

      - name: Build the requirement-to-test evidence report
        if: always()
        run: |
          python tools/r71_validation_report.py \
            --xml r71-evidence/results.xml \
            --matrix docs/R7_1_VALIDATION_MATRIX.json \
            --output r71-evidence/report.json \
            --markdown r71-evidence/report.md \
            --commit "$(git rev-parse HEAD)"

      - name: Retain validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r7-1-validation-evidence
          path: r71-evidence/
          retention-days: 90

      - name: Require passing tests
        if: steps.tests.outcome != 'success'
        run: exit 1


  manual-en-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      MANUAL_EN_TEST_DSN: "postgresql://test:test@127.0.0.1:5432/test"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -r requirements.txt pytest PyJWT
      - run: python -m pytest -q tests/test_manual_en_postgres.py
