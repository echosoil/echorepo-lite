name: Guild Zenodo release (offline)
on:
  pull_request:
    branches: ["develop"]
    paths:
      - "tools/publish_guilds_to_zenodo.py"
      - "tools/prepare_guild_publication.py"
      - "tools/publish_biodiversity_to_zenodo.py"
      - "tests/test_publish_guilds_to_zenodo.py"
      - ".github/workflows/guild-zenodo-release.yml"
  workflow_dispatch:
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install requests
      - run: python -m unittest discover -s tests -p 'test_publish_guilds_to_zenodo.py' -v
